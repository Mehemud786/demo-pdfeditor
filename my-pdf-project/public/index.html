<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python PDF Editor</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 3rem auto; padding: 0 1rem; }
        .drop-zone { border: 2px dashed #ccc; padding: 3rem 1rem; text-align: center; border-radius: 8px; background: #f9f9f9; margin-bottom: 1rem; }
        button { background: #000; color: #fff; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; cursor: pointer; font-size: 1rem; width: 100%; }
        button:hover { background: #333; }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>PDF Merger App</h1>
    <p>Upload multiple PDFs to merge them into a single file (Max 4.5MB total).</p>
    
    <form id="uploadForm">
        <div class="drop-zone">
            <input type="file" id="pdfFiles" accept="application/pdf" multiple required>
        </div>
        <button type="submit" id="submitBtn">Merge PDFs</button>
    </form>
    
    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.textContent = "Processing...";
            btn.disabled = true;

            const files = document.getElementById('pdfFiles').files;
            const formData = new FormData();
            
            // Append each selected file to the FormData object
            for (let file of files) {
                formData.append('files', file);
            }
            
            try {
                const response = await fetch('/api/merge', { 
                    method: 'POST', 
                    body: formData 
                });
                
                if (!response.ok) throw new Error("Upload too large or server error");
                
                // Trigger the download in the browser
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'merged.pdf';
                a.click();
            } catch (err) {
                alert(err.message);
            } finally {
                btn.textContent = "Merge PDFs";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
