<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Report PDF Editor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            background-color: #111;
            color: #fff;
            width: 100%;
            padding: 20px 0;
            text-align: center;
        }
        .container {
            max-width: 900px;
            width: 95%;
            margin: 30px auto;
            text-align: center;
        }
        .login-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 300px;
            margin: 0 auto 20px auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input {
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #0070f3;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #005bb5; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .pdf-viewer {
            margin-top: 30px;
            width: 100%;
            height: 700px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background-color: #fff;
            display: none;
        }
        #errorMessage { color: #d32f2f; margin-top: 15px; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Internal Report Processor</h1>
    </div>

    <div class="container">
        <p>Enter your portal credentials to fetch and edit the secure report.</p>
        
        <div class="login-box">
            <input type="text" id="userId" placeholder="User ID" required />
            <input type="password" id="password" placeholder="Password" required />
            <button id="generateBtn" onclick="loadPDF()">Login & Fetch Report</button>
        </div>
        
        <p id="errorMessage"></p>
        <iframe id="pdfFrame" class="pdf-viewer" title="PDF Viewer"></iframe>
    </div>

    <script>
        async function loadPDF() {
            const userId = document.getElementById('userId').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('generateBtn');
            const iframe = document.getElementById('pdfFrame');
            const errorMsg = document.getElementById('errorMessage');

            if (!userId || !password) {
                errorMsg.innerText = "Please enter both User ID and Password.";
                errorMsg.style.display = "block";
                return;
            }

            btn.innerText = "Authenticating & Processing...";
            btn.disabled = true;
            errorMsg.style.display = "none";
            iframe.style.display = "none";

            try {
                // Send a POST request to our Vercel API with the credentials
                const response = await fetch('/api/edit-pdf', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ userId, password })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || `Error ${response.status}`);
                }

                // Convert the response to a raw file object (Blob)
                const blob = await response.blob();
                
                // Create a temporary local URL for the iframe to display
                const objectUrl = URL.createObjectURL(blob);
                iframe.src = objectUrl;
                iframe.style.display = "block";

            } catch (error) {
                errorMsg.innerText = "Failed: " + error.message;
                errorMsg.style.display = "block";
            } finally {
                btn.innerText = "Login & Fetch Report";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
