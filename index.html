<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0E1629;
            color: #e2e8f0;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="bg-[#1a233a] p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-700">
        <h2 class="text-2xl font-bold mb-6 text-center text-red-400">Token Extractor</h2>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Username / Email</label>
                <input type="text" id="username" required 
                    class="w-full px-4 py-2 bg-[#0E1629] border border-gray-600 rounded-lg focus:outline-none focus:border-red-400">
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-2 bg-[#0E1629] border border-gray-600 rounded-lg focus:outline-none focus:border-red-400">
            </div>
            
            <button type="submit" 
                class="w-full py-2 px-4 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg transition duration-200">
                Extract Token
            </button>
        </form>

        <div id="resultArea" class="mt-6 hidden">
            <h3 class="text-sm font-bold text-gray-400 mb-2">Session Data:</h3>
            <pre id="tokenOutput" class="bg-[#0E1629] p-4 rounded-lg text-xs overflow-x-auto text-green-400 border border-gray-700 whitespace-pre-wrap"></pre>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const outputElement = document.getElementById('tokenOutput');
            const resultArea = document.getElementById('resultArea');
            
            outputElement.textContent = "Fetching from Vercel...";
            resultArea.classList.remove('hidden');
            outputElement.classList.replace('text-red-400', 'text-green-400');

            const formData = new FormData();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);

            try {
                // REPLACE THIS with your live Vercel URL
                const VERCEL_API_URL = 'https://YOUR-PROJECT-NAME.vercel.app/api/extract-token';
                
                const response = await fetch(VERCEL_API_URL, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.detail || `HTTP error! status: ${response.status}`);
                }
                
                outputElement.textContent = JSON.stringify(data, null, 2);
                
            } catch (error) {
                outputElement.textContent = "Error: " + error.message;
                outputElement.classList.replace('text-green-400', 'text-red-400');
            }
        });
    </script>
</body>
</html>
