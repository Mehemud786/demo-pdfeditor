<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python PDF Toolkit</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 3rem auto; padding: 0 1rem; color: #333; }
        h1 { text-align: center; }
        .card { border: 1px solid #ddd; padding: 2rem; border-radius: 8px; background: #f9f9f9; margin-bottom: 2rem; }
        .card h2 { margin-top: 0; }
        input[type="url"], input[type="text"] { width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input[type="file"] { margin-bottom: 1rem; width: 100%; }
        button { background: #000; color: #fff; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; cursor: pointer; font-size: 1rem; width: 100%; }
        button:hover { background: #333; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        hr { border: 0; height: 1px; background: #ddd; margin: 2rem 0; }
    </style>
</head>
<body>
    <h1>PDF Toolkit</h1>
<!-- UPDATED FEATURE: Open & Edit from URL -->
    <div class="card">
        <h2>Fetch & Edit PDF from URL</h2>
        <p>Fetch a PDF (with optional login) and optionally stamp text on it.</p>
        <form id="urlForm">
            <input type="url" id="pdfUrl" placeholder="https://example.com/document.pdf" required>
            
            <!-- NEW: Auth Inputs -->
            <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                <input type="text" id="pdfUser" placeholder="Username (Optional)" style="flex: 1; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;">
                <input type="password" id="pdfPass" placeholder="Password (Optional)" style="flex: 1; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <input type="text" id="pdfText" placeholder="Text to add (leave blank for none)">
            <button type="submit" id="urlBtn">Fetch & Add Text</button>
        </form>
    </div>
    
    <!-- FEATURE 1: Open & Edit from URL -->
    <div class="card">
        <h2>Fetch & Edit PDF from URL</h2>
        <p>Fetch a PDF and optionally stamp text on it.</p>
        <form id="urlForm">
            <input type="url" id="pdfUrl" placeholder="https://example.com/document.pdf" required>
            <input type="text" id="pdfText" placeholder="Text to add (leave blank for none)">
            <button type="submit" id="urlBtn">Fetch & Add Text</button>
        </form>
    </div>

    <hr>

    <!-- FEATURE 2: Merge Local PDFs -->
    <div class="card">
        <h2>Merge Local PDFs</h2>
        <p>Upload multiple PDFs to merge them into a single file.</p>
        <form id="uploadForm">
            <input type="file" id="pdfFiles" accept="application/pdf" multiple required>
            <button type="submit" id="submitBtn">Merge PDFs</button>
        </form>
    </div>
    
    <script>
        // --- URL Fetching & Editing Logic ---
        document.getElementById('urlForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('urlBtn');
            btn.textContent = "Processing...";
            btn.disabled = true;

            const url = document.getElementById('pdfUrl').value;
            const text = document.getElementById('pdfText').value;
            
            try {
                const response = await fetch('/api/open-link', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url, text: text }) 
                });
                
                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || "Server failed to process the request");
                }
                
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                window.open(blobUrl, '_blank');
                
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.textContent = "Fetch & Add Text";
                btn.disabled = false;
            }
        });

        // --- Local Merge Logic ---
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.textContent = "Merging...";
            btn.disabled = true;

            const files = document.getElementById('pdfFiles').files;
            const formData = new FormData();
            for (let file of files) formData.append('files', file);
            
            try {
                const response = await fetch('/api/merge', { method: 'POST', body: formData });
                
                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || "Server failed to merge PDFs");
                }
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'merged.pdf';
                a.click();
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.textContent = "Merge PDFs";
                btn.disabled = false;
            }
        });
        // --- URL Fetching & Editing Logic ---
document.getElementById('urlForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('urlBtn');
    btn.textContent = "Processing...";
    btn.disabled = true;
    
    const url = document.getElementById('pdfUrl').value;
    const text = document.getElementById('pdfText').value;
    
    // NEW: Get auth values
    const username = document.getElementById('pdfUser').value;
    const password = document.getElementById('pdfPass').value;
    
    try {
        const response = await fetch('/api/open-link', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            // NEW: Include username and password in payload
            body: JSON.stringify({
                url: url,
                text: text,
                username: username,
                password: password
            })
        });
        
        if (!response.ok) {
            const errData = await response.json();
            throw new Error(errData.detail || "Server failed to process the request");
        }
        
        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        window.open(blobUrl, '_blank');
        
    } catch (err) {
        alert("Error: " + err.message);
    } finally {
        btn.textContent = "Fetch & Add Text";
        btn.disabled = false;
    }
});
    </script>
</body>
</html>
