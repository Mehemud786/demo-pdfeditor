<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal URL PDF Editor</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 3rem auto; padding: 0 1rem; color: #111; background: #f4f4f5; }
        .editor-card { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        h1 { text-align: center; margin-bottom: 2rem; font-size: 1.5rem; }
        label { font-weight: bold; display: block; margin-bottom: 0.5rem; font-size: 0.9rem; }
        input[type="url"], input[type="text"] { width: 100%; padding: 0.75rem; margin-bottom: 1.5rem; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
        button { background: #2563eb; color: #fff; border: none; padding: 0.75rem; border-radius: 6px; cursor: pointer; font-size: 1rem; width: 100%; font-weight: bold; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .note { font-size: 0.8rem; color: #6b7280; margin-top: -1rem; margin-bottom: 1.5rem; display: block; }
    </style>
</head>
<body>

    <div class="editor-card">
        <h1>Universal PDF Fetch & Edit</h1>
        <form id="editorForm">
            <label for="pdfUrl">Target Document URL</label>
            <input type="url" id="pdfUrl" placeholder="https://example.com/report.pdf" required>
            <span class="note">Note: The server cannot fetch URLs that require a personal login/password.</span>
            
            <label for="pdfText">Add Text / Watermark</label>
            <input type="text" id="pdfText" placeholder="e.g., CONFIDENTIAL (Leave blank for none)">
            
            <button type="submit" id="processBtn">Fetch & Edit Document</button>
        </form>
    </div>

    <script>
        document.getElementById('editorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('processBtn');
            const originalText = btn.textContent;
            
            btn.textContent = "Fetching & Processing...";
            btn.disabled = true;

            const url = document.getElementById('pdfUrl').value;
            const text = document.getElementById('pdfText').value;
            
            try {
                const response = await fetch('/api/fetch-and-edit', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url, text: text }) 
                });
                
                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || "Failed to process the document.");
                }
                
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                // Open the edited PDF in a new browser tab
                window.open(blobUrl, '_blank');
                
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
