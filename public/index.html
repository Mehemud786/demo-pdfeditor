<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python PDF Editor</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 3rem auto; padding: 0 1rem; }
        .card { border: 1px solid #ddd; padding: 2rem; border-radius: 8px; background: #f9f9f9; margin-bottom: 2rem; }
        input[type="url"] { width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #000; color: #fff; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; cursor: pointer; font-size: 1rem; width: 100%; }
        button:hover { background: #333; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        hr { border: 0; height: 1px; background: #ddd; margin: 2rem 0; }
    </style>
</head>
<body>
    <h1>PDF Toolkit</h1>
    
    <!-- NEW FEATURE: Open from URL -->
    <div class="card">
        <h2>Open PDF from URL</h2>
        <p>Fetch a PDF securely via the server and open it in a new tab.</p>
        <form id="urlForm">
            <input type="url" id="pdfUrl" placeholder="https://example.com/document.pdf" required>
            <button type="submit" id="urlBtn">Fetch & Open</button>
        </form>
    </div>

    <hr>

    <!-- EXISTING FEATURE: Merge PDFs -->
    <div class="card">
        <h2>Merge Local PDFs</h2>
        <form id="uploadForm">
            <input type="file" id="pdfFiles" accept="application/pdf" multiple required style="margin-bottom: 1rem; width: 100%;">
            <button type="submit" id="submitBtn">Merge PDFs</button>
        </form>
    </div>
    
    <script>
        // --- NEW: URL Fetching Logic ---
        document.getElementById('urlForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('urlBtn');
            btn.textContent = "Fetching...";
            btn.disabled = true;

            const url = document.getElementById('pdfUrl').value;
            
            try {
                const response = await fetch('/api/open-link', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url }) 
                });
                
                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || "Server failed to fetch the URL");
                }
                
                // Create a blob URL and open it in a new tab
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                window.open(blobUrl, '_blank');
                
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.textContent = "Fetch & Open";
                btn.disabled = false;
            }
        });

        // --- EXISTING: Local Merge Logic ---
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            // (Keep your existing merge JavaScript code here)
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.textContent = "Processing...";
            btn.disabled = true;

            const files = document.getElementById('pdfFiles').files;
            const formData = new FormData();
            for (let file of files) formData.append('files', file);
            
            try {
                const response = await fetch('/api/merge', { method: 'POST', body: formData });
                if (!response.ok) throw new Error("Upload too large or server error");
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'merged.pdf';
                a.click();
            } catch (err) {
                alert(err.message);
            } finally {
                btn.textContent = "Merge PDFs";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
